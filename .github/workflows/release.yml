name: Publish

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.package-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          EXPECTED_TAG="v${{ steps.package-version.outputs.version }}"

          echo "Git tag:         ${GITHUB_REF_NAME}"
          echo "Expected tag:    ${EXPECTED_TAG}"

          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "ERROR: Git tag does not match pyproject.toml version."
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Check distribution contents
        run: python scripts/check_dist_contents.py dist/*

      - name: Show distributions
        run: ls -lh dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/shapcrn

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test-testpypi:
    name: Test TestPyPI installation
    if: github.event_name == 'workflow_dispatch'
    needs:
      - build
      - publish-testpypi

    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Download ShapCRN from TestPyPI
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"

          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: downloading shapcrn==$VERSION from TestPyPI"

            if python -m pip download \
              --no-deps \
              --index-url https://test.pypi.org/simple/ \
              "shapcrn==$VERSION" \
              --dest /tmp/shapcrn-test; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: package did not become available on TestPyPI."
              exit 1
            fi

            echo "Package not available yet. Waiting 15 seconds..."
            sleep 15
          done

      - name: Install downloaded TestPyPI package
        run: |
          python -m pip install /tmp/shapcrn-test/shapcrn-*.whl

      - name: Test CLI
        run: shapcrn --help

      - name: Test Python import
        run: |
          python -c "import shapcrn; print(shapcrn.SimulationResult)"

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/shapcrn

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
