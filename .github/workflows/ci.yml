name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not network"
      - run: ruff check src/shapcrn/api.py src/shapcrn/cli.py tests

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y graphviz graphviz-dev
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,network]"
      - run: python -m pytest -m network

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_dist_contents.py dist/*
      - run: python -m venv .venv-wheel
      - run: .venv-wheel/bin/python -m pip install dist/*.whl
      - run: .venv-wheel/bin/shapcrn --help
      - run: python -m venv .venv-sdist
      - run: .venv-sdist/bin/python -m pip install dist/*.tar.gz
      - run: .venv-sdist/bin/shapcrn --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
